# pick_cube 任務規格 —— 這是唯一該手改的檔案。
#
# build_scene.py 讀它產生 assets/pick_cube.usd,其餘每一支程式也都從這裡取值。
# 改任何數值 = 重跑 build_scene.py。**不要把數值寫進程式碼。**
#
# ⚠️ 改了 cube 或 gripper 底下的東西之後,先前錄的資料就作廢(物理變了)。
#    所以 M1 的工作就是把這一份定下來,再去錄 200 集。

paths:
  # 相對於這個 repo 的根目錄。找不到時 config.py 會依序試 candidates。
  # omx_bridge_image 這個 repo 的 checkout。它同時是 image 的來源,以及
  # **原生 Isaac** 讀 USD/URDF 的來源 —— Isaac 不在容器裡跑,所以檔案還是要在
  # host 上。用 image 的人可以這樣取出來:
  #   docker run --rm -v "$PWD:/out" <image> cp -r /assets /out
  omx_bridge:
    - "../../docker/robot/omx_bridge_image"                # 筆電 checkout
    - "../omx_bridge_image"                                # 伺服器並排 clone 時
    - "~/omx_vla/omx_bridge_image"
    - "/"                                                  # 容器內:image 把 assets/
                                                           # 跟 profile/ 烤在根目錄,
                                                           # 相對佈局跟 repo 一樣
  sim_real_bridge:                                        # 只為了 profile.py(關節順序的真相)
    - "../../docker/bridge/sim_real_bridge_image/bridge"   # 筆電
    - "../sim_real_bridge_image/bridge"                    # 伺服器
    - "~/omx_vla/sim_real_bridge_image/bridge"
  # 相對於 omx_bridge_image
  robot_usd: "assets/omx_f.usd"
  robot_urdf: "assets/omx_f/omx_f.urdf"
  profile: "profile/omx_f.profile.yaml"
  # 相對於這個 repo
  scene_usd: "assets/pick_cube.usd"

# ── ROS 介面 ────────────────────────────────────────────────────────────
# 方塊的位姿雙向都走 tf2_msgs(標準訊息),不用 Isaac 的自訂 srv 套件 ——
# 這個 base image 沒有介面產生工具,重建不了 Jazzy 版。
#
# ⚠️ 兩個 topic **必須不同**。共用 /tf 的話,publisher 的輸出會直接餵回
# subscriber,把方塊釘在原地 —— 一個靜默失效的 reset。
ros:
  cube_tf_topic: "tf"          # Isaac -> 我們:方塊現在在哪
  cube_set_topic: "tf_set"     # 我們 -> Isaac:把方塊放到這裡
  cube_frame: "cube"           # child_frame_id

scene:
  task_root: "/World/task"        # 我們新增的東西都掛在這底下,不碰 /omx_f
  robot_root: "/omx_f"            # sublayer 帶進來的,唯讀

# ── 要抓的方塊 ───────────────────────────────────────────────────────────
# 15 g @ 25 mm。夾爪指尖法向力約 0.14 N(可夾 25–30 g),所以這在預算內、
# 還有約 2 倍餘裕。夾不住時第一個該調的就是 mass。
cube:
  size: 0.025                     # m,邊長
  mass: 0.015                     # kg
  color: [0.85, 0.15, 0.15]
  # ⚠️ Isaac 預設 static_friction=0.2 太滑,一定要自己指定
  static_friction: 1.0
  dynamic_friction: 0.9
  restitution: 0.0

# ── 每回合方塊生成的位置 ─────────────────────────────────────────────────
# 環帶取樣。手臂最大伸展約 0.40 m(肩在 (-0.011, 0, 0.0975)),
# 這個範圍留了充足餘裕給「先移到方塊正上方」的姿態。
spawn:
  # ⚠️ 外緣從 0.26 收到 0.24(2026-08-05,依 sim/ik.py --map 的實測)。
  # 0.26 是憑「最大伸展 0.40 m」推的,漏算了夾爪垂直向下時手腕必須先高出目標
  # 114.6 mm —— 那段吃掉的是平面 2R 的 0.2825 m 額度。實際結果:
  #   r=0.24 -> 最高懸停 85 mm    r=0.25 -> 55 mm    r=0.26 -> 連抓取高度都搆不到
  # 在運動學極限旁邊取樣還會產生急動、接近奇異的軌跡,那是最糟的訓練資料。
  radius: [0.16, 0.24]            # m
  theta_deg: [-50.0, 50.0]        # 繞 +Z,0 = +X 方向
  yaw_deg: [-45.0, 45.0]          # 方塊自身朝向
  # 訓練絕不使用的保留區,用來驗證「策略真的在看影像」而不是背軌跡。
  # M5 的成敗就看這一區的成功率。
  holdout_theta_deg: [-50.0, -30.0]

# ── 相機 ────────────────────────────────────────────────────────────────
# front 是主相機,內參對齊 D455,日後 sim2real 只要換影像來源。
# wrist 掛在手臂上,錄起來備用 —— M5 會跑「只用 front」vs「兩台都用」的對照,
# 決定 sim2real 值不值得買一台腕上相機。
cameras:
  front:
    resolution: [640, 480]
    horizontal_fov_deg: 90.0      # D455 彩色鏡頭約 90°×65°
    # TODO(M1): 用實測的 camera_info 換算精確內參
    #   ros2 topic echo /camera/camera/color/camera_info --once
    #   再餵給 camera/cameracalibration/isaac_camera.py
    # 斜後上方往下看,方向不變,距離從 0.69 m 拉近到 0.50 m。
    # 0.69 m 時方塊只有 11.6 px(錄製降到 320x240 之後剩 6 px),畫面 2/3 是空
    # 地板。0.50 m 讓方塊變成 16 px,同時整個工作範圍——生成環帶 ±50°、夾爪在
    # 環帶上方 0.20 m 盤旋、底座——都還留 55 px 邊距。再近就會切到夾爪:
    # 0.45 m 剩 19 px,0.42 m 出界。
    #
    # 只動距離不動 FOV:90° 是要對齊 D455 的,那是日後 sim2real 換影像來源的
    # 前提。構圖用距離調,內參留給硬體。
    eye: [-0.1227, -0.2170, 0.3337]
    target: [0.21, 0.0, 0.03]     # 工作區中心
    clipping: [0.02, 10.0]
  wrist:
    resolution: [640, 480]
    horizontal_fov_deg: 70.0
    parent: "/omx_f/link5"          # 夾爪底座,跟著手臂動(link6/7 是手指)
    # 以下都在 **link5 的座標系**(home 時與世界軸對齊,所以可以直接讀)。
    # 掛在夾爪底座正上方,朝夾持點看 —— 用 look_at 而不是手轉 Euler 角,
    # 免得又像第一版那樣朝向反了、或俯角差 13°。
    # 2026-08-05 由使用者在 GUI 裡手動擺到貼合鏡頭座的位置,讀 Property 面板的
    # Transform 最後一列而來。朝向不用管 —— look_at 會依這個位置重算。
    translate: [0.04904, -0.00017, 0.03437]
    # 夾持點在 link5 座標系的實測位置(= EE + grasp_offset)
    look_at: [0.0859, -0.0018, -0.011]
    clipping: [0.01, 5.0]
  # 資料集裡的影像尺寸(算繪解析度會降到這個大小再存)
  record_resolution: [320, 240]

# ── 只在這個場景生效的物理覆寫 ───────────────────────────────────────────
# 這些是 pick_cube.usd 裡的 override,**不會動到 omx_f.usd**。
# omx_f.usd 是 sim↔real 校正鏈的一部分,必須保持位元不變。
overrides:
  gripper_drive:
    # 原始值 stiffness=625 / damping=40 對應指尖約 0.14 N。夾不住就往上調。
    joints: ["gripper_joint_1"]
    stiffness: 625.0
    damping: 40.0
  arm_drive:
    joints: ["joint1", "joint2", "joint3", "joint4", "joint5"]
    stiffness: 625.0
    damping: 40.0
  mimic_joint:
    # gripper_joint_2 是被動指:它**沒有 drive**(apiSchemas 是空的),只靠
    # PhysxMimicJoint 約束跟隨 gripper_joint_1。原廠 naturalFrequency=25 在
    # 1/120 s 的步長下太軟 —— 夾到東西時被動指會被推開、落後,變成只有一根
    # 手指在出力,怎麼調 drive stiffness 都夾不住。
    #
    # 調硬反而更貼近真實:真手臂第二指是齒輪連動的剛性連結,不是彈簧。
    joint: "gripper_joint_2"
    natural_frequency: 1000.0   # ← M1 要調的主要旋鈕(原廠 25 太軟)
    damping_ratio: 0.8

  finger_colliders:
    # 手指是塊狀零件(扁平比 3.7),convexHull 不會保留出平整夾持面。
    # 順序:convexHull → convexDecomposition → 加 pad(見 pads)
    prims:
      - "/colliders/link6/follower_07_gripper_motorized/node_STL_BINARY_"
      - "/colliders/link7/follower_08_gripper_gear/node_STL_BINARY_"
    approximation: "convexHull"
  pads:
    # 最後手段:在兩根手指內側各加一片薄板當夾持面。
    enabled: false
    size: [0.020, 0.002, 0.012]   # m

  hide:
    # URDF 的 end_effector_link 帶了一個 10mm 紅色 <box> 除錯標記
    # (omx_f.urdf 第 243-250 行)。它落在腕上相機正中央、擋住夾持點,
    # 而且跟目標方塊同一個紅色 —— 訓練影像裡最不該出現的東西。
    #
    # 蓋在這一層而不是改 URDF/USD:jog、to_sim、to_real 仍然看得到標記,
    # 只有任務場景看不到。
    #
    # 寫 Stage 樹上看到的路徑就好。它是 instance proxy,build_scene 會自己
    # 問 prim index 找出真正能覆寫的 /Flattened_Prototype_N/...。
    # 不要自己猜來源路徑:/visuals/link5/mesh_1 看起來像但不是,寫過去會
    # 靜默地什麼都沒發生。
    prims:
      - "/omx_f/link5/visuals/mesh_1"

# ── 夾爪開合 ────────────────────────────────────────────────────────────
# ⚠️ home(q=0)時夾爪是**閉合**的,正值 = 開。
gripper:
  joint: "gripper_joint_1"
  open: 0.60                      # rad
  closed: 0.0
  grasp: -0.05                    # 略超過接觸,靠 drive 持續施力
  # 夾持點相對 end_effector_link 的偏移,**在 EE 自己的座標系**(m)。
  # 2026-08-05 實測:GUI 裡手動夾住 25mm 方塊,量 cube 與 EE 的相對位置。
  # 世界座標的差會隨手臂姿態變,這個不會 —— 所以記這個。
  grasp_offset: [-0.006, -0.0002, -0.011]
  # 參考:夾住 25mm 方塊時 gripper_joint_1 實際停在 +0.278 rad。
  # 命令值(-0.05)比它更緊是刻意的,drive 才會持續施力。
  holding_position: 0.278

# ── 腳本專家 ────────────────────────────────────────────────────────────
# 產生示範資料用。它會用 ground truth 的方塊位置算 IK —— 這只發生在**產生
# 資料時**;策略看到的永遠只有影像 + 關節狀態,座標不會進入模型。
expert:
  speed: 0.15                     # m/s,工具空間移動
  joint_speed: 1.2                # rad/s,起始那段關節空間移動
  descend_speed: 0.05             # m/s,下降到夾持點時放慢
  hover_prefer: 0.12              # m,方塊上方的偏好懸停高度(搆不到會自動降)
  hover_floor: 0.05
  close_ticks: 15                 # 夾合後等幾個控制週期
  lift_extra: 0.03                # 抬到 success.lift_height 之上再多留一點
  lift_margin: 0.005              # 抬升至少要高過 lift_height 這麼多,否則規劃階段就放棄
  hold_margin: 10                 # HOLD 比 success.hold_steps 多撐幾個週期
  arrive_tol: 0.002               # m,判定到達路徑點
  max_ticks: 400                  # 單集上限,逾時算失敗

  # ⚠️ 雜訊不是可有可無的。腳本專家的軌跡近乎單模態,隨機化不夠時學生會學成
  # 「無視影像、照平均軌跡揮一遍」也能拿高分 —— 這是這類專案最常見的假成功。
  # 這裡要產生的是一個**分布**,不是一條軌道。M5 用保留區的成功率來驗收。
  noise:
    waypoint_xy: 0.005            # m,1σ,每個路徑點的水平抖動
    hover_height: 0.02            # m,1σ
    close_ticks: 3                # 控制週期,夾合時機
    joint_jitter: 0.002           # rad,1σ,每一步

# ── 成功判定 ────────────────────────────────────────────────────────────
# 兩個條件都要,而且要連續成立 hold_steps 步:
#   lifted 擋不住「方塊被彈飛」,held 才擋得住;
#   單一影格擋不住彈跳,連續才擋得住。
success:
  lift_height: 0.05               # m,高於方塊半徑
  max_ee_distance: 0.06           # m,方塊必須還在夾爪附近
  hold_steps: 15                  # 0.5 s @ 30 fps

# ── 時間 ────────────────────────────────────────────────────────────────
timing:
  physics_dt: 0.008333333          # 1/120
  render_every: 4                  # 每 4 個物理步算繪並記錄一次 → 30 fps
  fps: 30
  settle_steps: 20                 # reset 之後讓方塊落定
  # reset 之後、擷取第一張影像之前要空跑幾個**算繪**幀。
  #
  # ⚠️ 不是可選的。RTX 會跨幀累積,而 render=False 的步進完全不推進它。
  # 重置把方塊瞬移之後,前幾幀的影像**整張還是上一集**,之後才慢慢淡出殘影 ——
  # 等於在訓練影像裡放一個位置隨機的假目標。
  #
  # 2026-08-05 實測(方塊從 θ=-50 瞬移到 +50,量舊位置殘留的紅度 0-255):
  #   1-4 幀 78.5(全是舊畫面)  8 幀 42   16 幀 12
  #   32 幀 5.3                64 幀 0.2  128 幀 0
  # 取 128 = 完全乾淨。每回合多約 1 秒,相對 15 秒的回合可以忽略;要省的話
  # 64 幀的殘留(max 3/255)其實也看不出來。
  reset_render_frames: 128
  max_episode_steps: 450           # 15 s @ 30 fps,逾時視為失敗
