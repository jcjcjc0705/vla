# An idle container to run the VLA tools in. Nothing starts on its own.
#
# Isaac is NOT started by this. Open it yourself, load vla/assets/pick_cube.usd,
# press Play, then in here:
#
#   ros2 run omx_vla_app expert                                  # 5 episodes
#   ros2 run omx_vla_app expert --ros-args -p episodes:=20
#   ros2 run omx_bridge_app jog sim                              # drive it by hand
#
# The image already provides the engine, the profile and jog. This adds only the
# task: the VLA repo is mounted so `r` rebuilds it in place.
name: omx_vla

services:
  vla:
    image: omx_bridge_image:moveit
    container_name: omx_vla
    network_mode: host
    ipc: host
    environment:
      # Must match the value Isaac was launched with, or nothing discovers
      # anything and it looks exactly like a broken scene.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      # Where the nodes find sim/ik.py and sim/expert.py -- the same modules the
      # native Isaac runs use. There is one expert, not two.
      - VLA_ROOT=/vla
    volumes:
      # The whole repo: sim/ for the shared logic, task/ for the spec.
      - ../..:/vla
      # ROS packages, built in place with `r`. isaac_ros2_messages lives
      # here rather than in the image because Isaac ships it compiled for
      # Humble only, and this is Jazzy -- so it is rebuilt from the same
      # interface. The base image already has the generation tooling.
      - ../../src/omx_vla_app:/workspaces/src/omx_vla_app
      - ../../src/isaac_ros2_messages:/workspaces/src/isaac_ros2_messages
    command: sleep infinity
    stdin_open: true
    tty: true
