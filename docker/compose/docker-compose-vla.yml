# An idle container to run the VLA tools in. Nothing starts on its own.
#
# Isaac is NOT started by this. Open it yourself, load vla/assets/pick_cube.usd,
# press Play, then in here:
#
#   ros2 run data_collection expert                              # 5 episodes
#   ros2 run data_collection record --ros-args -p episodes:=500  # 錄進 data/raw
#   ros2 run omx_bridge_app jog sim                              # drive it by hand
#
#   python3 ml/convert.py                                        # raw -> LeRobotDataset
#   lerobot-train --dataset.repo_id=... --policy.type=act ...     # 訓練
#   python3 ml/eval.py --checkpoint outputs/.../pretrained_model  # 讓策略開手臂
#
# 全部在同一個容器裡,**不需要 venv 或 conda**:omx_vla_image 同時帶著 ROS 與
# torch,而 eval.py 需要兩者在同一個行程。
#
# The image already provides the engine, the profile, jog and the training
# stack. This adds only the task: the VLA repo is mounted so `r` rebuilds it in
# place.
name: omx_vla

services:
  vla:
    # omx_vla_image = omx_bridge_image + torch(cu128) + lerobot。所以這一個容器
    # 裡同時有引擎、profile、jog、MoveIt 解算器、Isaac prim 服務介面,**以及**
    # 訓練與推論的堆疊 —— `eval.py` 需要 torch 與 rclpy 在同一個行程,那是這條
    # 鏈長成這樣的原因。
    #
    # 這裡的原始碼如果比 image 新,症狀是一行 ModuleNotFoundError —— 先
    # docker compose pull。
    image: registry.screamtrumpet.csie.ncku.edu.tw/pochun/omx_vla_image:latest
    container_name: omx_vla
    network_mode: host
    ipc: host
    environment:
      # Must match the value Isaac was launched with, or nothing discovers
      # anything and it looks exactly like a broken scene.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      # ⚠️ Load-bearing, not cosmetic. omx_vla_app is mounted at two paths at
      # once (/vla/src/... and /workspaces/src/...), so task_config cannot find
      # the repo by counting directories up from __file__ -- it reads this.
      - VLA_ROOT=/vla
      # Where GR00T's weights land. Pointed at a mounted directory so the
      # ~10-15 GB download survives `docker compose down`, and so it is NOT
      # baked into the image -- the registry already forced torch to be split
      # across six layers to get pushed at all, and weights are a product
      # rather than an environment.
      - HF_HOME=/vla/.hf_cache
    volumes:
      # The whole repo: ml/ and isaac/ are plain scripts run by path, task/ is
      # the spec, data/ is where episodes land.
      - ../..:/vla
      # ⚠️ One line per package -- do NOT mount ../../src over /workspaces/src.
      # The image was built with `colcon build --symlink-install`: install/
      # points at build/, which points back at src/, so covering /workspaces/src
      # leaves the image's own sim_real_bridge and omx_bridge_app as dangling
      # symlinks. It fails as an ImportError that looks like a broken image.
      - ../../src/omx_vla_app:/workspaces/src/omx_vla_app
      - ../../src/data_collection:/workspaces/src/data_collection
    command: sleep infinity
    stdin_open: true
    tty: true
    # The control nodes do not need a GPU, but eval.py does: the policy and
    # rclpy have to run in the same process (torch to infer, rclpy to publish
    # /sync/command), and this container is the only place both exist. Isaac
    # keeps running natively on the host and is unaffected -- they share the
    # card, which the 96 GB has room for.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
