# 訓練參數。python3 ml/train.py 跑 active 那組;--steps=100 之類的命令列覆蓋優先。
# key 就是 lerobot 的旗標名(policy.tune_visual -> --policy.tune_visual)。
#
# ⚠️ 註解掉的是「可調,目前用預設」,不是不能用。後面標的是 lerobot 的預設值。
# 刻意不把預設寫成生效設定 —— 那會把它們釘死,lerobot 改了預設我們不會知道。

active: groot_v3

profiles:

  # ══════════════════════════════════════════════════════════════════════════
  # 三物體 + 語言條件 —— 這一輪要證明的事
  #
  # ⚠️ ACT 在這個任務上**結構上做不到**:modeling_act.py 裡完全沒有語言處理,
  # 它看不到 task 欄位。三個物體隨機指定一個,它的天花板就是隨機的 33%。
  # GR00T 只要明顯超過 33%,對照就成立 —— 那是整個專案的論點。
  #
  # 兩組吃同一份 dataset(256x256 補邊),所以看到的像素完全一樣。
  # GR00T 的 image_size 寫死 256,存更大只會偷偷讓 ACT 佔便宜。
  # ══════════════════════════════════════════════════════════════════════════

  # ACT —— 對照組,預期在 33% 附近
  act_3obj:
    dataset.repo_id: screamlab/omx_pick_3obj
    dataset.root: data/lerobot_3obj
    policy.type: act
    policy.device: cuda
    policy.push_to_hub: false
    batch_size: 64
    # 2000 集 x 約 208 幀 = 約 415k 幀。單物體任務時 ACT 與 GR00T 的最佳點都
    # 落在看過約 3.2 個 epoch 的地方,這裡照那個比例推:64 x 20000 = 1.28M
    # 樣本 = 3.1 epoch。⚠️ 那個 3.2 是在 486 集上量的,資料多 4 倍之後不保證
    # 還成立 —— save_freq 設密一點,靠掃描找峰值而不是相信這個數字。
    steps: 20000
    save_freq: 2500
    log_freq: 200
    num_workers: 4
    output_dir: outputs/act_3obj
    tensorboard: true

  # GR00T —— 主角。設定沿用 v1(單物體任務裡最好的那組:視覺凍住、lr 1e-4)
  # ⚠️ 不要再開 tune_visual。v2 用 1e-4 解凍崩到 12%,v3 降到 1e-5 也只回到
  # v1 的水準,而且在新 seed 上更差。那條路試過了。
  groot_3obj:
    dataset.repo_id: screamlab/omx_pick_3obj
    dataset.root: data/lerobot_3obj
    policy.type: groot
    policy.base_model_path: nvidia/GR00T-N1.7-3B
    policy.embodiment_tag: new_embodiment
    policy.device: cuda
    policy.push_to_hub: false
    # batch 24 在 v2/v3 實測是 61.6 GB,那是**開了** tune_visual 的數字;
    # 這裡沒開,可訓參數從 2.03B 降回 1.62B,顯存會更寬裕。
    # ⚠️ 速度沒實測過(v1 是 batch 8 / 0.41 s/step,v3 是 batch 24 + 解凍
    # 視覺 / 1.18 s/step),開跑前先用 --steps=30 探測。
    batch_size: 24
    steps: 24000          # 24 x 24000 = 576k 樣本 = 1.4 epoch。⚠️ 刻意先跑
                          # 不到一輪 3.2 epoch —— 那要 55k 步、十幾個小時。
                          # 先看曲線走向,不夠再 --resume 續跑。
    save_freq: 3000
    log_freq: 200
    num_workers: 4
    output_dir: outputs/groot_3obj
    tensorboard: true
  # 唯一實驗變數是 tune_visual。v1 保留區最好 43%,ACT 是 90%。
  # 所有可調參數都列在這一組底下。
  groot_v2:
    dataset.repo_id: screamlab/omx_pick_cube
    dataset.root: data/lerobot_3cam
    policy.type: groot
    policy.base_model_path: nvidia/GR00T-N1.7-3B
    policy.embodiment_tag: new_embodiment
    policy.device: cuda
    policy.push_to_hub: false

    # v1 是 false,視覺塔凍住 → 用通用特徵看 sim 畫面。ACT 的 ResNet18 會為場景
    # 調整(optimizer_lr_backbone=1e-05)而拿到 90%。這是對 43% 最合理的解釋。
    policy.tune_visual: true

    batch_size: 24    # v1 只用 36/96 GB。實測這組 2.03B 可訓、61.6 GB、1.18 s/step
    steps: 16000      # 24x16000=384k 樣本=3.8 epoch。兩個模型最佳點都在 ~320k
                      # (GR00T 40000x8、ACT 5000x64),v1 跑到 4.8 epoch 且 lr 歸零
    save_freq: 2000   # checkpoint 約 28 GB,8 個 224 GB。最佳點抓不準所以存密
    log_freq: 100
    num_workers: 4    # data_s 實測 0.032,加到 8 沒差
    output_dir: outputs/groot_v2
    tensorboard: true

    # ── 資料 ──────────────────────────────────────────────────────────────
    # dataset.episodes:                    # null=全部 486 集。給 list 可做資料量對照
    # dataset.eval_split: 0.0              # 設 0.1 + eval_steps 才有驗證曲線。
                                           # 現在 TensorBoard 只有訓練損失
    # dataset.use_imagenet_stats: true
    # dataset.return_uint8: false
    # dataset.streaming: false

    # ── 資料增強(預設關) ────────────────────────────────────────────────
    # 486 集配 2B 參數,ACT 已見過擬合(90%->37%)。幾乎不增加訓練時間。
    # tf: affine / brightness / contrast / hue / saturation / sharpness
    # dataset.image_transforms.enable: false
    # dataset.image_transforms.max_num_transforms: 3
    # dataset.image_transforms.random_order: false

    # ── 哪些層要訓練(v1 三個 True = 1.62B;加 tune_visual = 2.03B) ────────
    # policy.tune_projector: true          # state/action 編碼解碼 + 位置嵌入。
                                           # new_embodiment 的關鍵層,不要關
    # policy.tune_diffusion_model: true    # 流匹配動作頭,1.62B 的主要來源
    # policy.tune_vlln: true               # 進動作頭前的 LayerNorm + 自注意力
    # policy.tune_llm: false               # task 是常數字串,解凍只是浪費
    # policy.tune_top_llm_layers: 0        # 只解凍語言模型最上面 N 層

    # ── LoRA(想解凍更多層又要省顯存) ──────────────────────────────────────
    # policy.use_peft: false
    # policy.lora_rank: 0                  # >0 才啟用
    # policy.lora_alpha: 16
    # policy.lora_dropout: 0.1
    # policy.lora_full_model: false

    # ── 優化器(只在 use_policy_training_preset=true 時生效) ───────────────
    # policy.optimizer_lr: 1.0e-4          # v1 實測 2.0e-5 -> 9.4e-5(10k)->
                                           # 2.6e-5(40k,最佳)-> 9.2e-10(60k)
    # policy.optimizer_weight_decay: 1.0e-5
    # policy.optimizer_betas: [0.9, 0.999]
    # policy.optimizer_eps: 1.0e-8
    # policy.warmup_ratio: 0.05
    # use_policy_training_preset: true     # false 才能改用 --optimizer.* / --scheduler.*

    # ── 模型行為 ──────────────────────────────────────────────────────────
    # policy.n_action_steps: 40            # 規劃 40 步全部執行完(1.3s)才看新影像。
                                           # 降低=更常重新規劃。必須 <= chunk_size
    # policy.use_relative_actions: false   # 預測位移而非絕對角。⚠️ 等於換動作空間
    # policy.relative_exclude_joints:
    # policy.num_inference_timesteps:      # 流匹配去噪步數,只影響 eval
    # policy.rtc_ramp_rate:
    # policy.action_decode_transform: auto

    # ── 效能 ──────────────────────────────────────────────────────────────
    # policy.use_flash_attention: false    # 開了應該更快,沒實測
    # policy.use_bf16: true
    # policy.model_params_fp32: true
    # policy.use_amp: false
    # prefetch_factor: 4
    # persistent_workers: true

    # ── 訓練流程 ──────────────────────────────────────────────────────────
    # eval_steps: 0                        # >0 且 dataset.eval_split>0 才算驗證損失
    # max_eval_samples: 0
    # seed: 1000                           # ⚠️ 跟 eval.py --seed 無關,那個管方塊位置
    # save_checkpoint: true
    # resume: false                        # 搭 --config_path 從 checkpoint 續跑
    # cudnn_deterministic: false
    # job_name:

  # ── GR00T v3:修長寬比 + 降 lr ──────────────────────────────────────────
  # v2(tune_visual + lr 1e-4)崩到 12%。兩個獨立的原因,這一組同時處理:
  #
  # 1. lr。GrootConfig **沒有** backbone 專屬 lr 欄位(ACTConfig 有
  #    optimizer_lr_backbone),所以 tune_visual 一開,400M 的預訓練視覺塔就跟動作
  #    頭一起吃 1e-4 —— 比 ACT 給 ResNet18 的高 10 倍。證據:v2 訓練損失更低
  #    (0.0049 vs v1 0.0082)而保留區更差,擬合更好、泛化更爛 = 災難性遺忘。
  #    降到 1e-5,正好是 ACT 給 backbone 的量級。
  #
  # 2. 長寬比。GR00T 的 letter_box_transform=False,把 320x240 直接拉成 256x256
  #    (橫 x0.80、縱 x1.067)。25mm 方塊在原圖 8x8 px,拉完變 6.4x8.5 —— 正方形
  #    變成高比寬多 33%,而且扭曲量隨 yaw 變化。ACT 吃原尺寸,沒這問題。
  #    lerobot_3cam_sq 是 convert.py --pad-square 補成 320x320 的版本。
  #
  # ⚠️ 兩個一起改,所以歸因不乾淨。長寬比那個算修 bug(把 GR00T 的輸入拉到跟 ACT
  # 一樣公平)而不是實驗變數,但要講清楚。
  #
  # steps/batch 刻意跟 v2 一樣,好直接對照。
  groot_v3:
    dataset.repo_id: screamlab/omx_pick_cube
    dataset.root: data/lerobot_3cam_sq
    policy.type: groot
    policy.base_model_path: nvidia/GR00T-N1.7-3B
    policy.embodiment_tag: new_embodiment
    policy.device: cuda
    policy.push_to_hub: false
    policy.tune_visual: true
    policy.optimizer_lr: 1.0e-5
    batch_size: 24
    steps: 16000
    save_freq: 2000
    log_freq: 100
    num_workers: 4
    output_dir: outputs/groot_v3
    tensorboard: true

  # ── GR00T v1:實際跑過的那組,留著對照 ──────────────────────────────────
  # 結果:保留區最好 43%(step 40000)。完整數字見 outputs/eval_sweep_result.txt
  groot_v1:
    dataset.repo_id: screamlab/omx_pick_cube
    dataset.root: data/lerobot_3cam
    policy.type: groot
    policy.base_model_path: nvidia/GR00T-N1.7-3B
    policy.embodiment_tag: new_embodiment
    policy.device: cuda
    policy.push_to_hub: false
    batch_size: 8
    steps: 60000
    save_freq: 10000
    log_freq: 200
    num_workers: 4
    output_dir: outputs/groot_v1
    tensorboard: true

  # ── ACT:M5 的基準,保留區 90% ──────────────────────────────────────────
  # step 5000 就 90%,之後反而退步(10000:50%、15000:37%、20000:77%)。
  # 要重現的話 steps 設 6000、save_freq 1000 就夠,不需要 20000。
  act:
    dataset.repo_id: screamlab/omx_pick_cube
    dataset.root: data/lerobot_3cam
    policy.type: act
    policy.device: cuda
    policy.push_to_hub: false
    batch_size: 64
    steps: 6000
    save_freq: 1000
    log_freq: 200
    num_workers: 4
    output_dir: outputs/act_v2
    tensorboard: true

    # ACT 特有的旋鈕(跟 GR00T 不同)
    # policy.chunk_size: 100               # GR00T 是 40
    # policy.n_action_steps: 100
    # policy.vision_backbone: resnet18
    # policy.pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
    # policy.optimizer_lr: 1.0e-5
    # policy.optimizer_lr_backbone: 1.0e-5 # ⚠️ 非零 = 視覺 backbone 會被訓練。
                                           # 這正是 GR00T 預設沒做的事
    # policy.use_vae: true
    # policy.kl_weight: 10.0               # loss = l1_loss + kl_weight * kld_loss
    # policy.dim_model: 512
    # policy.n_encoder_layers: 4
    # policy.n_decoder_layers: 1
    # policy.temporal_ensemble_coeff:      # 設了會對重疊 chunk 做時間平均

# ⚠️ 看起來能調、lerobot 訓練迴圈實際不讀的(GR00T 獨立訓練器的遺留欄位):
#   policy.batch_size / dataloader_num_workers / max_steps / save_steps /
#   output_dir / report_to / resume / dataset_paths
#   → 用頂層的 batch_size / num_workers / steps / save_freq / output_dir
#
# ⚠️ 架構硬限制,動了對不上預訓練權重:
#   max_state_dim / max_action_dim 132、chunk_size 40、image_size [256,256]、
#   normalization_mapping 全 IDENTITY(GR00T 自己做 q01/q99)、
#   input_features / output_features(從 dataset 推導)
#
# ⚠️ 這裡調不到,在別處決定:
#   相機組合 ml/convert.py --cameras;影像 320x240、隨機化範圍、保留帶、集數
#   都在錄製時由 task/pick_cube.task.yaml 決定
